<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Foot Sizer MVP</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; background: #f4f7f6; padding: 20px; margin: 0; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #333; margin-bottom: 5px; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        .camera-box { position: relative; width: 100%; max-width: 400px; margin: 0 auto; border-radius: 8px; overflow: hidden; background: #000; aspect-ratio: 3/4; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 3px solid #00bc70; box-sizing: border-box; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
        .guide-text { background: rgba(0,0,0,0.6); color: white; padding: 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        button { background: #00bc70; color: white; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 15px; width: 100%; max-width: 400px; transition: 0.2s; }
        button:hover { background: #009858; }
        #results { margin-top: 25px; padding: 15px; background: #eef9f4; border-radius: 8px; display: none; text-align: left; }
        .size-row { display: flex; justify-content: space-between; margin: 8px 0; font-size: 16px; border-bottom: 1px dashed #ccc; padding-bottom: 4px; }
        .size-val { font-weight: bold; color: #00bc70; }
    </style>
</head>
<body>

<div class="container">
    <h1>AI Foot Measure</h1>
    <p>Place a standard credit card flat next to your foot, then snap a photo directly from above.</p>
    
    <div class="camera-box">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="overlay">
            <div class="guide-text">ALIGN FOOT & CARD INSIDE FRAME</div>
            <div style="border: 2px dashed rgba(255,255,255,0.5); height: 60%; width: 100%;"></div>
            <div class="guide-text">KEEP PHONE PARALLEL TO FLOOR</div>
        </div>
    </div>
    
    <button id="capture-btn">Measure My Foot</button>
    <canvas id="canvas" style="display:none;"></canvas>

    <div id="results">
        <h3 style="margin-top:0; color:#333;">Your Recommended Sizes</h3>
        <div class="size-row"><span>Foot Length:</span><span class="size-val" id="res-cm">-</span></div>
        <div class="size-row"><span>UK Size:</span><span class="size-val" id="res-uk">-</span></div>
        <div class="size-row"><span>US Men Size:</span><span class="size-val" id="res-us">-</span></div>
        <div class="size-row"><span>EU Size:</span><span class="size-val" id="res-eu">-</span></div>
    </div>
</div>

<script>
    const video = document.getElementById('webcam');
    const captureBtn = document.getElementById('capture-btn');
    const canvas = document.getElementById('canvas');
    const resultsBox = document.getElementById('results');

    // Initialize camera stream automatically on page load
    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } }, 
                audio: false 
            });
            video.srcObject = stream;
        } catch (err) {
            alert("Camera access denied or unavailable. Please enable permissions.");
            console.error(err);
        }
    }

    // Capture dynamic image and post binary stream to serverless API backend
    captureBtn.addEventListener('click', async () => {
        captureBtn.innerText = "Analyzing Dimensions...";
        captureBtn.disabled = true;

        const ctx = canvas.getContext('2d');
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        // Export raw canvas matrix out to Base64 payload string
        const base64Image = canvas.toDataURL('image/jpeg');

        try {
            const response = await fetch('/api/measure', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: base64Image })
            });
            
            const data = await response.json();
            
            if (data.status === "success") {
                document.getElementById('res-cm').innerText = `${data.measurements.cm} cm (${data.measurements.inches}")`;
                document.getElementById('res-uk').innerText = data.shoe_sizes.uk;
                document.getElementById('res-us').innerText = data.shoe_sizes.us_men;
                document.getElementById('res-eu').innerText = data.shoe_sizes.eu;
                resultsBox.style.display = "block";
            } else {
                alert(`Analysis Failed: ${data.message}`);
            }
        } catch (error) {
            alert("Network connection error reaching AI Engine.");
            console.error(error);
        } finally {
            captureBtn.innerText = "Measure My Foot";
            captureBtn.disabled = false;
        }
    });

    window.addEventListener('load', startCamera);
</script>
</body>
</html>
